<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Музыкальная библиотека - Вход</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Музыкальная библиотека</h1>
        </header>

        <main>
            <div class="auth-container">
                <div class="auth-form">
                    <h2>Вход в систему</h2>
                    <form id="login-form">
                        <div class="form-group">
                            <label for="login">Логин:</label>
                            <input type="text" id="login" name="login" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Пароль:</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn">Войти</button>
                    </form>
                    <p class="auth-link">Нет аккаунта? <a href="#" id="show-register">Зарегистрироваться</a></p>
                </div>
                
                <div class="auth-form" id="register-form-container" style="display: none;">
                    <h2>Регистрация</h2>
                    <form id="register-form">
                        <div class="form-group">
                            <label for="reg-login">Логин:</label>
                            <input type="text" id="reg-login" name="login" required>
                        </div>
                        <div class="form-group">
                            <label for="reg-password">Пароль:</label>
                            <input type="password" id="reg-password" name="password" required>
                        </div>
                        <div class="form-group">
                            <label for="reg-first-name">Имя:</label>
                            <input type="text" id="reg-first-name" name="first_name">
                        </div>
                        <div class="form-group">
                            <label for="reg-last-name">Фамилия:</label>
                            <input type="text" id="reg-last-name" name="last_name">
                        </div>
                        <div class="form-group">
                            <label for="reg-email">Email:</label>
                            <input type="email" id="reg-email" name="email">
                        </div>
                        <button type="submit" class="btn">Зарегистрироваться</button>
                    </form>
                    <p class="auth-link">Уже есть аккаунт? <a href="#" id="show-login">Войти</a></p>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        document.getElementById('show-register').addEventListener('click', function(e) {
            e.preventDefault();
            document.querySelector('.auth-form').style.display = 'none';
            document.getElementById('register-form-container').style.display = 'block';
        });
        
        document.getElementById('show-login').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('register-form-container').style.display = 'none';
            document.querySelector('.auth-form').style.display = 'block';
        });
        
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const loginData = Object.fromEntries(formData);
            
            fetch('/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(loginData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.user_id) {
                    window.location.href = '/tracks';
                } else {
                    alert('Ошибка входа: ' + data.error);
                }
            })
            .catch(error => {
                console.error('Ошибка:', error);
                alert('Произошла ошибка при входе');
            });
        });
        
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const registerData = Object.fromEntries(formData);
            
            fetch('/api/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(registerData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.user_id) {
                    alert('Регистрация успешна! Теперь вы можете войти в систему.');
                    document.getElementById('register-form-container').style.display = 'none';
                    document.querySelector('.auth-form').style.display = 'block';
                } else {
                    alert('Ошибка регистрации: ' + data.error);
                }
            })
            .catch(error => {
                console.error('Ошибка:', error);
                alert('Произошла ошибка при регистрации');
            });
        });
    </script>
</body>
</html>
